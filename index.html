  <!-- رمز قوقل أدسنس (Google AdSense) -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8981208150142836" crossorigin="anonymous"></script>

  <!-- تنسيق زر ترجمة جوجل وإخفاء شريط الإشعارات العلوي -->
  <style>
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0px !important; }
    #google_translate_element {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
    }
    #google_translate_element select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background-color: #ffffff;
      font-size: 13px;
      cursor: pointer;
    }
  </style>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

  <!-- زر ترجمة جوجل (يتيح اختيار الإنجليزية أو العربية) -->
  <div id="google_translate_element"></div>

  <div id="root"></div>

  <!-- سكريبت تشغيل ترجمة جوجل -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ar',
        includedLanguages: 'en,ar',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script type="module" src="/src/main.tsx"></script>
